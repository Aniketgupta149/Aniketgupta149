<svg xmlns="http://www.w3.org/2000/svg" width="840" height="230" viewBox="0 0 840 230" role="img" aria-label="Journey: 2020 HSC Science, 2022 B.Sc. Computer Science, 2023 web development intern and teacher, 2025 data analytics upskilling, now building analytics apps and open to Data Analyst roles">
  <style>
    .panel { fill: #141c2b; stroke: #2c5364; stroke-width: 1.5; }
    .track { stroke: #2c5364; stroke-width: 4; stroke-linecap: round; }
    .line  { stroke: url(#flow); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 672; animation: draw 2.4s ease-out backwards; }
    .dot   { fill: #0f2027; stroke: #00d4ff; stroke-width: 4; transform-box: fill-box; transform-origin: center; animation: pop .45s ease-out backwards; }
    .now   { fill: #00d4ff; }
    .ring  { fill: none; stroke: #00d4ff; stroke-width: 2; transform-box: fill-box; transform-origin: center; animation: ping 2s 2.6s ease-out infinite; opacity: 0; }
    .step  { animation: fade .6s ease-out backwards; }
    .year  { font: 700 15px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #00d4ff; letter-spacing: 1px; }
    .title { font: 600 13px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #e6edf3; }
    .sub   { font: 400 11.5px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #8b9bb4; }
    .hi    { font: 600 11.5px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #3fb950; }
    .d1 { animation-delay: .1s; } .d2 { animation-delay: .6s; } .d3 { animation-delay: 1.1s; } .d4 { animation-delay: 1.6s; } .d5 { animation-delay: 2.1s; }
    @keyframes draw { from { stroke-dashoffset: 672; } to { stroke-dashoffset: 0; } }
    @keyframes pop  { from { transform: scale(0); } 70% { transform: scale(1.3); } to { transform: scale(1); } }
    @keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes ping { from { transform: scale(1); opacity: .9; } to { transform: scale(2.6); opacity: 0; } }
  </style>
  <defs>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2c5364"/>
      <stop offset="1" stop-color="#00d4ff"/>
    </linearGradient>
  </defs>

  <rect class="panel" x="1" y="1" width="838" height="228" rx="16"/>

  <line class="track" x1="84" y1="88" x2="756" y2="88"/>
  <line class="line"  x1="84" y1="88" x2="756" y2="88"/>

  <circle class="dot d1" cx="84"  cy="88" r="9"/>
  <circle class="dot d2" cx="252" cy="88" r="9"/>
  <circle class="dot d4" cx="588" cy="88" r="9"/>
  <circle class="ring"   cx="756" cy="88" r="9"/>
  <circle class="dot now d5" cx="756" cy="88" r="9"/>

  <g class="step d1" text-anchor="middle">
    <text class="year"  x="84" y="58">2020</text>
    <text class="title" x="84" y="128">HSC · Science (PCM)</text>
    <text class="sub"   x="84" y="148">PetOxford High School</text>
    <text class="sub"   x="84" y="166">School topper in CS</text>
  </g>
  <g class="step d2" text-anchor="middle">
    <text class="year"  x="252" y="58">2022</text>
    <text class="title" x="252" y="128">B.Sc. Computer Science</text>
    <text class="sub"   x="252" y="148">Mumbai University</text>
    <text class="sub"   x="252" y="166">CGPA 8.25 / 10</text>
  </g>
  <g class="step d4" text-anchor="middle">
    <text class="year"  x="588" y="58">2025</text>
    <text class="title" x="588" y="128">Data Analytics Upskilling</text>
    <text class="sub"   x="588" y="148">NSDC · ITVedant · IBM</text>
    <text class="sub"   x="588" y="166">SQL · Power BI · Tableau</text>
  </g>
  <g class="step d5" text-anchor="middle">
    <text class="year"  x="756" y="58">NOW</text>
    <text class="title" x="756" y="128">Building Analytics web Apps at Abhinandan Creation</text>
    <text class="sub"   x="756" y="148">AppScrpt · GoogleSheet · Clude</text>
    <text class="hi"    x="756" y="166">Open to Data Analyst roles</text>
  </g>

  <text class="sub" x="420" y="206" text-anchor="middle" style="font-style:italic">Question → Collect → Clean → Analyze → Visualize → Decide</text>
</svg>
