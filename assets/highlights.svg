<svg xmlns="http://www.w3.org/2000/svg" width="840" height="170" viewBox="0 0 840 170" role="img" aria-label="15+ projects, 20+ certifications, 6 dashboards, 8.25 CGPA">
  <style>
    .tile   { animation: rise .7s ease-out backwards; }
    .t2     { animation-delay: .15s; }
    .t3     { animation-delay: .30s; }
    .t4     { animation-delay: .45s; }
    .card   { fill: #141c2b; stroke: #2c5364; stroke-width: 1.5; animation: glow 3s ease-in-out infinite; }
    .num    { font: 700 40px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: url(#shine); }
    .label  { font: 600 15px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #e6edf3; }
    .sub    { font: 400 11.5px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #8b9bb4; }
    .bar    { fill: #00d4ff; transform-box: fill-box; transform-origin: center; animation: grow 1s .6s ease-out backwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes glow { 0%, 100% { stroke: #2c5364; } 50% { stroke: #00d4ff; } }
  </style>
  <defs>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d4ff"/>
      <stop offset="0.5" stop-color="#b8f6ff"/>
      <stop offset="1" stop-color="#00d4ff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0; -1 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <g transform="translate(0 0)"><g class="tile t1">
    <rect class="card" x="1" y="10" width="193" height="148" rx="14"/>
    <text class="num" x="97" y="72" text-anchor="middle">15+</text>
    <text class="label" x="97" y="100" text-anchor="middle">Projects on GitHub</text>
    <text class="sub" x="97" y="122" text-anchor="middle">Python · SQL · BI · Web</text>
    <rect class="bar" x="37" y="140" width="120" height="3" rx="1.5"/>
  </g></g>

  <g transform="translate(215 0)"><g class="tile t2">
    <rect class="card" x="1" y="10" width="193" height="148" rx="14" style="animation-delay:.75s"/>
    <text class="num" x="97" y="72" text-anchor="middle">20+</text>
    <text class="label" x="97" y="100" text-anchor="middle">Certifications</text>
    <text class="sub" x="97" y="122" text-anchor="middle">IBM · Deloitte · DeepLearning.AI</text>
    <rect class="bar" x="37" y="140" width="120" height="3" rx="1.5"/>
  </g></g>

  <g transform="translate(430 0)"><g class="tile t3">
    <rect class="card" x="1" y="10" width="193" height="148" rx="14" style="animation-delay:1.5s"/>
    <text class="num" x="97" y="72" text-anchor="middle">6</text>
    <text class="label" x="97" y="100" text-anchor="middle">Dashboards &amp; Apps</text>
    <text class="sub" x="97" y="122" text-anchor="middle">Power BI · Tableau · Streamlit</text>
    <rect class="bar" x="37" y="140" width="120" height="3" rx="1.5"/>
  </g></g>

  <g transform="translate(645 0)"><g class="tile t4">
    <rect class="card" x="1" y="10" width="193" height="148" rx="14" style="animation-delay:2.25s"/>
    <text class="num" x="97" y="72" text-anchor="middle">8.25</text>
    <text class="label" x="97" y="100" text-anchor="middle">CGPA · B.Sc. CS</text>
    <text class="sub" x="97" y="122" text-anchor="middle">Mumbai University</text>
    <rect class="bar" x="37" y="140" width="120" height="3" rx="1.5"/>
  </g></g>
</svg>
